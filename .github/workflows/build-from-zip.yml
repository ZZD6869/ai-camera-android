
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 3 -name 'ai-camera-cloud-build.zip' -print -quit)"
          test -n "$ZIP" || { echo "ERROR: ZIP not found"; exit 1; }
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          echo "=== Searching for Gradle wrapper ==="
          find /tmp/project -maxdepth 8 -name gradlew -type f -print

          PROJECT="$(find /tmp/project -maxdepth 8 -name gradlew -type f -print -quit)"
          test -n "$PROJECT" || { echo "ERROR: gradlew not found in ZIP"; exit 1; }
          PROJECT="$(dirname "$PROJECT")"

          echo "=== Project directory ==="
          echo "$PROJECT"
          echo "=== Android manifests ==="
          find /tmp/project -maxdepth 10 -name AndroidManifest.xml -print

          test -f "$PROJECT/app/src/main/AndroidManifest.xml" || {
            echo "ERROR: AndroidManifest.xml not found under $PROJECT"
            exit 1
          }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x "$PROJECT/gradlew"
          "$PROJECT/gradlew" -p "$PROJECT" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-camera-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
