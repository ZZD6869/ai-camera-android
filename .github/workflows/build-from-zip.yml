
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP="$(find . -maxdepth 3 -name 'ai-camera-cloud-build.zip' -print -quit)"
          test -n "$ZIP" || { echo "ERROR: ZIP not found"; exit 1; }
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

      - name: Inspect Android project
        run: |
          echo "=== Gradle files ==="
          find /tmp/project -maxdepth 5 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \) -print
          echo "=== App directory ==="
          find /tmp/project -maxdepth 4 -type d -name app -print
