
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check uploaded ZIP
        run: |
          ls -la
          find . -maxdepth 3 -name '*.zip'

      - name: Extract project
        run: |
          ZIP="$(find . -maxdepth 3 -name 'ai-camera-cloud-build.zip' -print -quit)"
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          find /tmp/project -maxdepth 4 -name settings.gradle -o -name settings.gradle.kts
