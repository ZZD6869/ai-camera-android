
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(find . -maxdepth 3 -name 'ai-camera-cloud-build.zip' -print -quit)"
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          PROJECT="/tmp/project/ai-camera"
          test -f "$PROJECT/gradlew" || { echo "gradlew not found"; exit 1; }
          test -f "$PROJECT/app/src/main/AndroidManifest.xml" || { echo "AndroidManifest.xml not found"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x "$PROJECT/gradlew"
          "$PROJECT/gradlew" -p "$PROJECT" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-camera-debug-apk
          path: /tmp/project/ai-camera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
